description: |
  Source, and a notarized macOS download:
  https://github.com/mwiget/bnkscope-field

  bnkscope Field is a native macOS and iPadOS app that talks to Kubernetes
  clusters over their own apiserver. There is no agent to install in the
  cluster, no Prometheus, and no port forward held open from a laptop — every
  screen here is built from plain apiserver calls, and the telemetry is scraped
  and differenced on the Mac itself.

  This is a live lab, recorded end to end: three clusters imported from one
  multi-context kubeconfig, an exporter injected into a running F5 TMM pod as an
  ephemeral container, live TMM statistics at a two-second cadence, commands run
  inside the pod's debug and routing containers, and the log stream filtered.

  Nothing is staged. The faults on screen are the ones the lab actually had —
  two pods running but not ready, a readiness probe timing out, and no exporter
  yet on either TMM pod.

  Chapters:
  00:00 What it is
