# Builds the Mac app on every merge to main, signs and notarizes it, and
# attaches it to a GitHub release — so there is always a current download that
# opens on anyone's Mac without Gatekeeper arguing about it.
#
# Cost note: macOS runners bill at ten times the Linux rate and this repository
# is private, so a run that takes a few minutes of wall clock counts as tens of
# minutes against the quota. That is why there is no build on pull requests —
# worth adding if it turns out to be wanted.
name: macOS app

on:
  push:
    branches: [main]
    # A macOS runner bills at ten times the Linux rate, and prose does not
    # change the binary. Release notes are deliberately not listed: editing
    # those should produce a release that carries them.
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

permissions:
  contents: write          # to create the release and upload the app to it

concurrency:
  group: macos-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The newest Xcode the runner has, rather than its default, which lags.
      # Verified against Xcode 26.6 / macOS 26.5 SDK; the app needs nothing
      # newer, since it deploys back to macOS 15.
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build
        run: |
          xcodebuild \
            -project App/BNKScopeField.xcodeproj \
            -scheme BNKScopeField \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Signed with Developer ID and notarized, which is what lets a download
      # open on someone else's Mac. Both halves are needed: the signature says
      # who built it, the notarization says Apple has scanned it, and Gatekeeper
      # wants both. The certificate goes into a keychain created for this run
      # and thrown away with the runner, so the default keychain is untouched.
      - name: Sign and notarize
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/bnkscope Field.app"

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Without this codesign would block on a GUI prompt for the key, which
          # on a runner means hanging until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # No --deep: the bundle has no nested code, and Apple deprecates it.
          # The hardened runtime and a secure timestamp are both preconditions
          # for notarization rather than nice-to-haves.
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          # --wait can return success for a submission Apple rejected, so the
          # status is read rather than inferred from the exit code.
          set +e
          RESULT=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json)
          STATUS=$?
          set -e
          echo "$RESULT"
          SUBMISSION=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' || true)
          VERDICT=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' || true)
          if [ "$VERDICT" != "Accepted" ] || [ "$STATUS" -ne 0 ]; then
            echo "notarization did not succeed: $VERDICT"
            [ -n "$SUBMISSION" ] && xcrun notarytool log "$SUBMISSION" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
            rm -f "$RUNNER_TEMP/notary.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"

          # Stapling puts the ticket inside the app, so a Mac that is offline
          # or behind a filtering proxy still sees it as notarized.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Check what was built
        run: |
          APP="build/Build/Products/Release/bnkscope Field.app"
          lipo -archs "$APP/Contents/MacOS/bnkscope Field"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          python3 Tools/check-icns.py "$APP/Contents/Resources/AppIcon.icns"
          # The one check that speaks for a downloader's Mac rather than ours.
          # "source=Notarized Developer ID" is the verdict that means the zip
          # below will open without anyone being sent to System Settings.
          spctl --assess --type execute -vvv "$APP" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt

      - name: Package
        id: package
        run: |
          VERSION=$(grep -m1 -o 'MARKETING_VERSION = [^;]*' \
            App/BNKScopeField.xcodeproj/project.pbxproj | awk '{print $3}')
          echo "tag=v${VERSION}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/bnkscope Field.app" \
            bnkscope-Field-macOS.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            bnkscope-Field-macOS.zip \
            --title "bnkscope Field for macOS — ${{ steps.package.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --notes-file .github/release-notes-macos.md
